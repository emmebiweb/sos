name: SOS
options:
  bundleIdPrefix: com.emmeibweb
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: JS4SY4GQXQ
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SOS:
    type: application
    platform: iOS
    sources:
      - SOS
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emmeibweb.sosapp
        PRODUCT_NAME: SOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: SOS/Info.plist
      properties:
        CFBundleDisplayName: SOS
        CFBundleDevelopmentRegion: it
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Logo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.emmeibweb.sosapp
            CFBundleURLSchemes: [soshelp]
        LSApplicationQueriesSchemes: [sms, tel]
        NSLocationWhenInUseUsageDescription: "SOS usa la tua posizione per inviarla ai tuoi contatti di emergenza quando chiedi aiuto."
    dependencies:
      - target: SOSWidget

  SOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - SOSWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emmeibweb.sosapp.widget
        PRODUCT_NAME: SOSWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: SOSWidget/Info.plist
      properties:
        CFBundleDisplayName: SOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
